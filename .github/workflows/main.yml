name: Android APK Olustur
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Sabit Keystore ve SHA1 Goster
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=BasariPusulasi,O=Android,C=TR"
          keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android | grep -E "SHA1:|SHA256:"
          grep "applicationId" app/build.gradle.kts || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - run: gradle assembleDebug --no-build-cache
      - uses: actions/upload-artifact@v4
        with:
          name: Basari-Uygulama-APK
          path: "**/build/outputs/apk/debug/*.apk"
