name: Android APK Olustur
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Eksik Keystore ve Firebase Dosyasini Olustur
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          if [ ! -f app/google-services.json ]; then
            PKG=$(grep -E "namespace|applicationId" app/build.gradle* | head -n 1 | sed -E 's/.*["'\'']([^"'\'']+)["'\''].*/\1/')
            [ -z "$PKG" ] && PKG="com.example.basari"
            cat <<EOF > app/google-services.json
          {
            "project_info": {
              "project_number": "123456789000",
              "project_id": "basari-pusulasi",
              "storage_bucket": "://appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789000:android:1234567890abcdef",
                  "android_client_info": {
                    "package_name": "$PKG"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "://googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyForBuild1234567890"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": [
                      {
                        "client_id": "://googleusercontent.com",
                        "client_type": 3
                      }
                    ]
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Basari-Uygulama-APK
          path: "**/build/outputs/apk/debug/*.apk"
